          async function getProxyTimezone(browser) {
            const providers = [
              { url: "https://ipwho.is/", parse: d => d.timezone?.id },
              { url: "https://ipinfo.io/json", parse: d => d.timezone },
              { url: "http://ip-api.com/json", parse: d => d.timezone }
            ];

            for (const provider of providers) {
              let ctx;
              try {
                ctx = await browser.newContext({ ignoreHTTPSErrors: true });
                const page = await ctx.newPage();
                console.log(`Checking timezone via ${provider.url}`);
                await page.goto(provider.url, { waitUntil: "domcontentloaded" });
                const text = await page.locator("body").innerText();
                if (!text || !text.trim().startsWith("{")) throw new Error("Response is not JSON");
                const data = JSON.parse(text);
                const tz = provider.parse(data);
                if (!tz) throw new Error("No timezone found");
                await ctx.close();
                console.log(`Detected timezone: ${tz}`);
                return tz;
              } catch (err) {
                console.log(`Timezone provider failed: ${err.message}`);
                if (ctx) await ctx.close().catch(() => {});
              }
            }

            console.log("Using fallback timezone: Asia/Dhaka");
            return "Asia/Dhaka";
          }

          async function safeClick(locator, label, timeout = 30000) {
            console.log(`Clicking ${label}`);
            await locator.waitFor({ state: "visible", timeout });
            await locator.scrollIntoViewIfNeeded();
            await locator.click();
          }

          async function safeClickWithPopupRecovery(page, locator, label, timeout = 30000, retries = 4) {
            let lastErr = null;
            for (let attempt = 1; attempt <= retries; attempt++) {
              try {
                await dismissConsentPopup(page);
                await page.waitForTimeout(300);
                await safeClick(locator, `${label} (attempt ${attempt}/${retries})`, timeout);
                return;
              } catch (err) {
                lastErr = err;
                console.log(`⚠️ Click failed for ${label} on attempt ${attempt}: ${err.message}`);
                await dismissConsentPopup(page).catch(() => {});
                await page.evaluate(() => {
                  document.body.style.overflow = "";
                  document.documentElement.style.overflow = "";
                  const nodes = [...document.querySelectorAll("*")];
                  let touched = 0;
                  for (const el of nodes) {
                    try {
                      const s = window.getComputedStyle(el);
                      if ((s.position === "fixed" || s.position === "sticky") &&
                          parseInt(s.zIndex || "0", 10) >= 999 &&
                          el.offsetWidth >= window.innerWidth * 0.9 &&
                          el.offsetHeight >= window.innerHeight * 0.6) {
                        el.style.pointerEvents = "none";
                        el.style.display = "none";
                        touched++;
                      }
                    } catch (_) {}
                  }
                  return touched;
                }).catch(() => {});
                await page.waitForTimeout(700);
              }
            }
            throw new Error(`Failed to click ${label} after ${retries} attempts. Last error: ${lastErr?.message || "unknown"}`);
          }

