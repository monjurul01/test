              let greetingTime = "শুভ দিন";
              if (dhakaHour >= 5 && dhakaHour < 12) greetingTime = "শুভ সকাল";
              else if (dhakaHour >= 12 && dhakaHour < 17) greetingTime = "শুভ দুপুর";
              else if (dhakaHour >= 17 && dhakaHour < 22) greetingTime = "শুভ সন্ধ্যা";
              else greetingTime = "শুভ রাত্রি";
              return `হ্যালো শাওন ভাই, ${greetingTime}`;
            } catch (_) {
              return "হ্যালো শাওন ভাই";
            }
          }

          // --- PROFILE ROTATION STATE MANAGER ---

          // Returns the next profile index whose upload count is still below perProfileLimit.
          // Returns -1 if every profile has reached its limit for today.
          function getNextAvailableProfile(lastUsedIndex, uploadCounts, total, perProfileLimit) {
            let next = (lastUsedIndex + 1) % total;
            for (let i = 0; i < total; i++) {
              if ((uploadCounts[next] || 0) < perProfileLimit) return next;
              next = (next + 1) % total;
            }
            return -1; // all profiles at their limit
          }

          async function getProfileState(totalProfilesCount) {
            console.log("Checking profile rotation state...");
            
            // Get current date in Dhaka timezone (e.g. "5/1/2026")
            const today = new Date().toLocaleString("en-US", { timeZone: "Asia/Dhaka" }).split(",")[0];
            
            let state;
            try {
              state = await firebaseGet("uploadState");
            } catch (e) {
              state = null;
            }

            if (!state) {
              state = {
                lastUploadDate: "",
                totalUploadsToday: 0,
                lastUsedProfileIndex: -1,
                totalProfilesAvailable: totalProfilesCount,
                profileUploadCounts: {}
              };
            }

            state.totalProfilesAvailable = totalProfilesCount;

            // Backward-compat: older records may have profilesUsedToday array instead
            if (typeof state.profileUploadCounts !== "object" || Array.isArray(state.profileUploadCounts)) {
              state.profileUploadCounts = {};
            }

            if (state.lastUploadDate !== today) {
              console.log("New day detected! Resetting daily upload count and profile usage.");
              // ── Rotate upload type each new day through all 7 content types ──
              const TYPE_CYCLE = ["AUDIO", "WALLPAPER", "WALLPAPER_24H", "WALLPAPER_DUAL", "WALLPAPER_BATTERY", "LIVE_WALLPAPER", "CHARGING_ANIMATION"];
              const DAY_LABELS = { AUDIO: "🎵 Ringtone", WALLPAPER: "🖼️ Wallpaper", WALLPAPER_24H: "🌅 24H Wallpaper", WALLPAPER_DUAL: "🔒 Dual Wallpaper", WALLPAPER_BATTERY: "🔋 Battery Wallpaper", LIVE_WALLPAPER: "🎬 Live Wallpaper", CHARGING_ANIMATION: "⚡ Charging Animation" };
              const prevType = TYPE_CYCLE.includes(state.uploadDayType) ? state.uploadDayType : TYPE_CYCLE[TYPE_CYCLE.length - 1]; // if no record yet, cycle lands on AUDIO for Day 1
              state.uploadDayType = TYPE_CYCLE[(TYPE_CYCLE.indexOf(prevType) + 1) % TYPE_CYCLE.length];
              console.log(`📅 Day changed — today's upload type: ${state.uploadDayType} (${DAY_LABELS[state.uploadDayType]} day)`);
              state.lastUploadDate = today;
              state.totalUploadsToday = 0;
              state.profileUploadCounts = {};
              // lastUsedProfileIndex is intentionally NOT reset here so the rotation
              // continues from where it left off across days.
              // e.g. 6 profiles, limit 3/day: Day1→0,1,2  Day2→3,4,5  Day3→0,1,2 ...
            }

            // Ensure uploadDayType is always initialized (very first run ever)
            if (!state.uploadDayType) {
              state.uploadDayType = "AUDIO"; // First day defaults to ringtone
              console.log("📅 First-ever run — defaulting to AUDIO (🎵 Ringtone) day");
            }

            const ZEDGE_DAILY_LIMIT = 3; // Zedge max uploads per day
            if (state.totalUploadsToday >= ZEDGE_DAILY_LIMIT) {
              console.log(`🛑 Zedge daily limit of ${ZEDGE_DAILY_LIMIT} uploads reached. Exiting safely.`);
              process.exit(0); 
            }

            // How many uploads each profile may do today.
            // Spreads the daily limit as evenly as possible across available profiles:
            //   1 profile  → 3 uploads each
            //   2 profiles → 2 uploads for first, 1 for second  (total = 3)
            //   3+ profiles → 1 upload each
            const perProfileLimit = Math.ceil(ZEDGE_DAILY_LIMIT / totalProfilesCount);

            const nextProfileIndex = getNextAvailableProfile(state.lastUsedProfileIndex, state.profileUploadCounts, totalProfilesCount, perProfileLimit);

            if (nextProfileIndex === -1) {
              console.log("🛑 All profiles have reached their daily upload limit. Exiting safely.");
              process.exit(0);
            }

            const countsDisplay = Object.entries(state.profileUploadCounts).map(([k,v]) => `P${k}:${v}`).join(", ") || "none";
            console.log(`Upload counts today: {${countsDisplay}} | Per-profile limit: ${perProfileLimit} | Next: ${nextProfileIndex}`);
            return { state, nextProfileIndex, perProfileLimit };
          }

          async function updateProfileStateAfterUpload(state, usedProfileIndex) {
            console.log(`Updating state: Profile ${usedProfileIndex} was used. Total today is now ${state.totalUploadsToday + 1}`);
            
            const profileUploadCounts = { ...(state.profileUploadCounts || {}) };
            profileUploadCounts[usedProfileIndex] = (profileUploadCounts[usedProfileIndex] || 0) + 1;

            await firebasePatch("uploadState", {
              lastUploadDate: state.lastUploadDate,
              totalUploadsToday: state.totalUploadsToday + 1,
              lastUsedProfileIndex: usedProfileIndex,
              totalProfilesAvailable: state.totalProfilesAvailable,
              profileUploadCounts,
              uploadDayType: state.uploadDayType
            });
          }
          // ----------------------------------------

          const SET_SLOTS = {
            WALLPAPER_24H: ["morning", "afternoon", "evening", "night"],
            WALLPAPER_DUAL: ["lock", "home"],
            WALLPAPER_BATTERY: ["critical", "low", "mid", "high", "full", "charging"]
          };
          const VIDEO_TYPES = ["LIVE_WALLPAPER", "CHARGING_ANIMATION"];

          function getItemContentType(item) {
            if (item && item.contentType) return item.contentType;
            const mp3 = item && (item.isMp3 || (item.name && item.name.toLowerCase().endsWith(".mp3")));
            return mp3 ? "RINGTONE" : "WALLPAPER";
          }

          function slotFileUrl(item, slot) {
            const v = item && item.files ? item.files[slot] : null;
            return typeof v === "string" ? v : ((v && v.fileUrl) || "");
          }

          function hasSetFiles(item) {
            const slots = SET_SLOTS[getItemContentType(item)];
            if (!slots) return false;
            return slots.every(s => slotFileUrl(item, s));
          }

          async function getNextWallpaperFromRealtimeDB(dayType, dayTypeLocked = false) {
            console.log(`Checking Firebase Realtime Database queue... (Today's type: ${dayType}${dayTypeLocked ? " - LOCKED for today" : ""})`);
            console.log(`ACTIVE_DB: ${firebaseDatabaseURL}`);
            const data = await firebaseGet(queuePath);
            if (!data) throw new Error(`No items found in Realtime Database (${firebaseDatabaseURL})`);

            // STALE CLAIM RECOVERY: if a previous run crashed hard (runner killed),
            // an item can stay stuck in "processing" forever and would never upload.
            // Recover claims older than 3h back to "queued" (max 2 recoveries, then "failed"
            // so a repeatedly-crashing item can never be uploaded twice by accident).
            const STALE_CLAIM_MS = 3 * 60 * 60 * 1000;
            for (const [sid, sitem] of Object.entries(data)) {
              if (!sitem || sitem.status !== "processing") continue;
              const claimAge = Date.now() - (sitem.processingAt || 0);
              if (claimAge <= STALE_CLAIM_MS) continue;
              const recoveries = (sitem.staleRecoveries || 0) + 1;
              if (recoveries > 2) {
                console.log(`STALE_CLAIM => "${sitem.name || sid}" crashed ${recoveries} times - marking failed (manual requeue needed).`);
                await firebasePatch(`${queuePath}/${sid}`, { status: "failed", error: "Stale processing claim - run crashed repeatedly", failedAt: Date.now() });
                sitem.status = "failed";
              } else {
                console.log(`STALE_CLAIM => "${sitem.name || sid}" stuck in processing for ${Math.round(claimAge / 60000)} min - recovering to queued (recovery #${recoveries}).`);
                await firebasePatch(`${queuePath}/${sid}`, { status: "queued", claimToken: null, processingAt: null, staleRecoveries: recoveries });
                sitem.status = "queued";
              }
            }

            const allQueued = Object.entries(data).filter(([_, item]) =>
              item &&
              item.status === "queued" &&
              (item.fileBase64 || item.imageBase64 || item.fileUrl || hasSetFiles(item))
            );

            const typeCounts = {};
            allQueued.forEach(([_, item]) => {
              const t = getItemContentType(item);
              typeCounts[t] = (typeCounts[t] || 0) + 1;
            });
            console.log(`QUEUE_COMPOSITION => total:${allQueued.length} | ${JSON.stringify(typeCounts)} | dayType:${dayType}`);

            // Which queue content type belongs to today's day type
            const wantedType = dayType === "AUDIO" ? "RINGTONE" : dayType;

            // Pinned scheduling: items pinned to today's date (or overdue) take priority over the rotation
            const todayKey = new Date(Date.now() + 6 * 3600 * 1000).toISOString().slice(0, 10);
            const pinnedEntries = allQueued
              .filter(([_, item]) => item.scheduledDate && item.scheduledDate <= todayKey)
              .sort((a, b) =>
                String(a[1].scheduledDate).localeCompare(String(b[1].scheduledDate)) ||
                ((a[1].createdAt || 0) - (b[1].createdAt || 0))
              );
            if (pinnedEntries.length) {
              console.log(`PINNED_QUEUE => ${pinnedEntries.length} item(s) pinned for <= ${todayKey}; pinned item overrides rotation type.`);
            }

            // Oldest-first queued entries of one content type (not scheduled for a future day)
            const entriesOfType = (t) => allQueued
              .filter(([_, item]) => (!item.scheduledDate || item.scheduledDate <= todayKey) && getItemContentType(item) === t)
              .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

            // DAY-TYPE SKIP (strict "each content on its own day"):
            // If today's type has nothing queued (and nothing is pinned), we do NOT borrow
            // another type onto this day. Instead the DAY ITSELF becomes the next type in the
            // cycle that actually has stock, and the rotation continues from there.
            //   e.g. WALLPAPER day, 0 wallpapers, 0 24H, 4 dual  ->  today becomes DUAL day,
            //        tomorrow is BATTERY day, and so on.
            // The new day type is persisted to Firebase so all runs today + tomorrow's rotation agree.
            // FULL-DAY RULE: a content type only gets a day when it has a FULL day of stock
            // (MIN_STOCK_FOR_DAY = 3). Types with 1-2 items WAIT until restocked (or are pinned
            // manually). Once a rotation upload happens the day type is LOCKED - it never
            // switches mid-day, so a day always shows exactly one content type.
            const MIN_STOCK_FOR_DAY = 3;
            let pickedType = wantedType;
            let effectiveDayType = dayType;
            let dayTypeSwitchedTo = null;
            let entries = pinnedEntries.length ? pinnedEntries : entriesOfType(wantedType);
            if (!pinnedEntries.length) {
              if (dayTypeLocked) {
                if (!entries.length) {
                  throw new Error(`DAY_LOCKED => today is a ${dayType} day (locked) and no more ${wantedType} queued. Not switching type mid-day - nothing more to upload today.`);
                }
              } else if (entries.length < MIN_STOCK_FOR_DAY) {
                const TYPE_CYCLE_SKIP = ["AUDIO", "WALLPAPER", "WALLPAPER_24H", "WALLPAPER_DUAL", "WALLPAPER_BATTERY", "LIVE_WALLPAPER", "CHARGING_ANIMATION"];
                const startIdx = Math.max(0, TYPE_CYCLE_SKIP.indexOf(dayType));
                const waiting = [];
                if (entries.length) waiting.push(`${wantedType}:${entries.length}/${MIN_STOCK_FOR_DAY}`);
                let chosen = null;
                for (let step = 1; step < TYPE_CYCLE_SKIP.length && !chosen; step++) {
                  const tryDayType = TYPE_CYCLE_SKIP[(startIdx + step) % TYPE_CYCLE_SKIP.length];
                  const tryType = tryDayType === "AUDIO" ? "RINGTONE" : tryDayType;
                  const found = entriesOfType(tryType);
                  if (found.length >= MIN_STOCK_FOR_DAY) {
                    chosen = { tryDayType, tryType, found };
                  } else if (found.length) {
                    waiting.push(`${tryType}:${found.length}/${MIN_STOCK_FOR_DAY}`);
                  }
                }
                if (!chosen) {
                  throw new Error(`WAIT_FOR_STOCK => no content type has a full day of stock (>= ${MIN_STOCK_FOR_DAY}). Waiting: [${waiting.join(", ")}]. Add more files or pin an item manually. Nothing uploaded.`);
                }
                pickedType = chosen.tryType;
                effectiveDayType = chosen.tryDayType;
                dayTypeSwitchedTo = chosen.tryDayType;
                entries = chosen.found;
                console.log(`DAY_TYPE_SKIP => ${dayType} day has only ${entriesOfType(wantedType).length}/${MIN_STOCK_FOR_DAY} ${wantedType}; today is now a ${chosen.tryDayType} day (${chosen.found.length} available). Waiting for restock: [${waiting.join(", ") || "none"}]`);
                // Persist immediately so the dashboard + later runs today see the switched type
                await firebasePatch("uploadState", { uploadDayType: dayTypeSwitchedTo });
              }
            }

            if (!entries.length) {
              throw new Error(`Queue is completely EMPTY - no uploadable item of ANY type found. Queue => ${JSON.stringify(typeCounts)}. DB=${firebaseDatabaseURL}`);
            }

            const [id, item] = entries[0];
            const localDir = path.join(process.cwd(), "downloads");
            fs.mkdirSync(localDir, { recursive: true });

            const contentType = getItemContentType(item);
            const isMp3 = contentType === "RINGTONE";

            // Defensive guard (double-check); pinned and fallback picks may legally differ from the rotation type
            const isPinnedPick = Boolean(item.scheduledDate && item.scheduledDate <= todayKey);
            if (isPinnedPick) {
              console.log(`PINNED_PICK => "${item.name || id}" was scheduled for ${item.scheduledDate} (today: ${todayKey})`);
            } else if (contentType !== pickedType) {
              throw new Error(`Day/type mismatch guard triggered. dayType=${effectiveDayType}, pickedType=${pickedType}, item=${item.name || id}, contentType=${contentType}`);
            } else if (dayTypeSwitchedTo) {
              console.log(`DAY_TYPE_SKIP_UPLOAD => uploading ${contentType} "${item.name || id}" - day switched ${dayType} -> ${dayTypeSwitchedTo} (no ${wantedType} queued).`);
            }

            // ANTI DOUBLE-UPLOAD GUARD: claim this item FIRST with a unique token,
            // then verify we own the claim. If any other run already claimed this file,
            // abort immediately so the same file can NEVER be uploaded twice.
            const claimToken = `claim-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            await firebasePatch(`${queuePath}/${id}`, {
              status: "processing",
              processingAt: Date.now(),
              claimToken
            });
            const claimCheck = await firebaseGet(`${queuePath}/${id}`);
            if (!claimCheck || claimCheck.claimToken !== claimToken) {
              throw new Error(`Queue item ${id} was already claimed by another run - aborting to prevent double upload.`);
            }

            async function downloadToFile(url, filePath, label) {
              console.log(`Downloading ${label} from R2: ${url}`);
              const res = await fetch(url);
              if (!res.ok) throw new Error(`Failed to download ${label} from R2: HTTP ${res.status}`);
              const arrayBuffer = await res.arrayBuffer();
              fs.writeFileSync(filePath, Buffer.from(arrayBuffer));
            }

            let localFile;
            let localFiles = [];
            let fileUrls = [];
            let localThumb = null;

            if (SET_SLOTS[contentType]) {
              // Multi-image set (24H / Dual / Battery) - download every slot image in order
              if (!hasSetFiles(item)) {
                throw new Error(`${contentType} item ${id} is missing one or more slot images (${SET_SLOTS[contentType].join(", ")})`);
              }
              for (const slot of SET_SLOTS[contentType]) {
                const slotUrl = slotFileUrl(item, slot);
                const slotFile = path.join(localDir, `${id}-${slot}.jpg`);
                await downloadToFile(slotUrl, slotFile, `${contentType} ${slot} image`);
                localFiles.push(slotFile);
                fileUrls.push(slotUrl);
              }
              localFile = localFiles[0];
              console.log(`${contentType} set ready - ${localFiles.length} images downloaded`);
            } else if (VIDEO_TYPES.includes(contentType)) {
              // Video content (Live Wallpaper / Charging Animation) + auto thumbnail
              const isMov = item.name && item.name.toLowerCase().endsWith(".mov");
              localFile = path.join(localDir, `${id}${isMov ? ".mov" : ".mp4"}`);
              await downloadToFile(item.fileUrl, localFile, item.name || id);
              localFiles = [localFile];
              fileUrls = [item.fileUrl];
              if (item.thumbUrl) {
                localThumb = path.join(localDir, `${id}-thumb.jpg`);
                await downloadToFile(item.thumbUrl, localThumb, "cover thumbnail");
                fileUrls.push(item.thumbUrl);
              } else {
                console.warn(`${contentType} item ${id} has no thumbUrl - cover image step will be skipped`);
              }
            } else {
              const isJpeg = item.name && item.name.toLowerCase().endsWith(".jpeg");
              const ext = isMp3 ? ".mp3" : (isJpeg ? ".jpeg" : ".jpg");
              localFile = path.join(localDir, `${id}${ext}`);

              console.log(`Saving queued item: ${item.name || id} as ${ext}`);
              if (item.fileUrl) {
                await downloadToFile(item.fileUrl, localFile, item.name || id);
              } else {
                const base64Data = item.fileBase64 || item.imageBase64;
                if (base64Data) {
                  const base64 = base64Data.includes(",")
                    ? base64Data.split(",")[1]
                    : base64Data;
                  fs.writeFileSync(localFile, Buffer.from(base64, "base64"));
                } else {
                  throw new Error(`Queue item ${id} is missing both fileUrl and base64 data`);
                }
              }
              localFiles = [localFile];
              if (item.fileUrl) fileUrls = [item.fileUrl];
            }

            // Item already claimed above (anti double-upload guard) - no re-claim needed.

            return {
              id,
              localFile,
              localFiles,
              localThumb,
              contentType,
              isMp3,
              dayTypeSwitchedTo,
              isPinnedPick,
              name:        item.name || id,
              title:       item.title || "",
              tags:        item.tags || "",
              category:    item.category || "",
              description: item.description || "",
              fileUrl:     item.fileUrl || "",
              fileUrls
            };
          }

          async function markWallpaperDoneAndDelete(id, name, fileUrlOrUrls) {
            console.log(`Upload successful - deleting "${name}" from Firebase...`);
            await firebaseDelete(`${queuePath}/${id}`);
            console.log(`"${name}" permanently removed from Firebase queue`);

            const urls = (Array.isArray(fileUrlOrUrls) ? fileUrlOrUrls : [fileUrlOrUrls]).filter(Boolean);

            for (const fileUrl of urls) {
              let fileKey = "";
              try {
                const u = new URL(fileUrl);
                fileKey = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
              } catch {
                // fallback for malformed URL strings
                fileKey = String(fileUrl).replace(/^https?:\/\/[^/]+\//i, "");
              }

              try {
                console.log(`R2 delete request => fileUrl: ${fileUrl}`);
                console.log(`R2 delete request => parsed key: ${fileKey}`);

                const res = await fetch(r2WorkerUrl, {
                  method: "DELETE",
                  headers: {
                    "X-File-Name": fileKey
                  }
                });

                const body = await res.text().catch(() => "");
                if (res.ok) {
                  console.log(`Successfully deleted key "${fileKey}" from Cloudflare R2. Status=${res.status} Body=${body}`);
                } else {
                  console.warn(`R2 delete failed for key "${fileKey}". Status=${res.status} Body=${body}`);
                }
              } catch (err) {
