          async function dismissConsentPopup(page) {
            console.log("Checking for consent/cookie popups in all frames...");
            let clickedAny = false;

            const acceptPriority = [
              "accept all cookies",
              "accept all",
              "agree to all",
              "accept cookies",
              "i agree",
              "agree",
              "allow all",
              "allow",
              "continue",
              "accept & continue",
              "got it",
              "ok",
              "okay",
              "proceed",
              "understand"
            ];

            const negativeWords = ["reject", "disagree", "decline", "optional", "deny"];

            const socialOrLoginKeywords = [
              "facebook", "google", "apple", "email", "password", 
              "login", "log in", "signin", "sign in", "signup", "sign up", 
              "register", "create account", "continue with", "facebook lite", "sign up"
            ];

            for (const frame of page.frames()) {
              try {
                const clicked = await frame.evaluate(({ acceptPriority, negativeWords, socialOrLoginKeywords }) => {
                  const buttons = Array.from(document.querySelectorAll("button, [role='button'], a"));
                  
                  const isLoginPage = window.location.href.includes("account.zedge.net") || 
                                       window.location.href.includes("login") || 
                                       !!document.querySelector('input[type="email"], input[type="password"]');

                  const isConsentContainer = (el) => {
                    let cur = el;
                    while (cur) {
                      const id = (cur.id || "").toLowerCase();
                      const className = (typeof cur.className === "string" ? cur.className : "").toLowerCase();
                      const role = (cur.getAttribute?.("role") || "").toLowerCase();
                      if (id.includes("didomi") || className.includes("didomi") ||
                          id.includes("consent") || className.includes("consent") ||
                          id.includes("cookie") || className.includes("cookie") ||
                          id.includes("privacy") || className.includes("privacy") ||
                          id.includes("popup") || className.includes("popup") ||
                          role === "dialog" || role === "alertdialog") {
                        return true;
                      }
                      cur = cur.parentElement;
                    }
                    return false;
                  };

                  const candidates = [];
                  for (const btn of buttons) {
                    const rect = btn.getBoundingClientRect();
                    const isVisible = rect.width > 0 && rect.height > 0 && 
                                      window.getComputedStyle(btn).display !== "none" && 
                                      window.getComputedStyle(btn).visibility !== "hidden";
                    if (!isVisible) continue;

                    const text = (btn.innerText || "").trim().toLowerCase();
                    const ariaLabel = (btn.getAttribute("aria-label") || "").trim().toLowerCase();
                    const title = (btn.getAttribute("title") || "").trim().toLowerCase();
                    const id = (btn.id || "").trim().toLowerCase();
                    const className = (typeof btn.className === "string" ? btn.className : "").trim().toLowerCase();
                    const combined = `${text} ${ariaLabel} ${title} ${id} ${className}`.trim();

                    if (!combined) continue;

                    if (negativeWords.some(w => combined.includes(w))) continue;
                    if (socialOrLoginKeywords.some(w => combined.includes(w))) continue;
                    if (isLoginPage && !isConsentContainer(btn)) continue;

                    candidates.push({ btn, text, ariaLabel, title, combined });
                  }

                  for (const phrase of acceptPriority) {
                    const match = candidates.find(c => {
                      if (phrase === "ok" || phrase === "okay" || phrase === "agree" || phrase === "allow" || phrase === "continue") {
                        const words = c.text.split(/\s+/);
                        return words.includes(phrase) || c.text === phrase;
                      }
                      return c.text === phrase || c.ariaLabel === phrase || c.title === phrase || c.combined.includes(phrase);
                    });

                    if (match) {
                      match.btn.click();
                      return { clicked: true, text: match.text || match.ariaLabel || "button" };
                    }
                  }

                  const generic = candidates.find(c =>
                    c.combined.includes("accept") || c.combined.includes("agree")
                  );
                  if (generic) {
                    generic.btn.click();
                    return { clicked: true, text: generic.text || "generic button" };
                  }

                  return { clicked: false };
                }, { acceptPriority, negativeWords, socialOrLoginKeywords });

                if (clicked && clicked.clicked) {
                  console.log(`✅ Clicked consent accept element: "${clicked.text}" in frame: ${frame.url()}`);
                  clickedAny = true;
                  await page.waitForTimeout(500);
                }
              } catch (_) {}
            }

            // Fallback close/remove only if no accept click happened
            if (!clickedAny) {
              try {
                const nuked = await page.evaluate(() => {
                  let killed = 0;

                  function nukeElements(root) {
                    let k = 0;
                    if (!root) return k;

                    const selectors = [
                      '#didomi-host',
                      '.didomi-popup',
                      '[id*="didomi"]',
                      '[class*="didomi"]',
                      'dialog',
                      '[role="dialog"]',
                      '[class*="consent"]',
                      '[class*="cookie"]',
                      '[class*="privacy"]',
                      '[class*="modal"]',
                      '[class*="popup"]',
                      '[class*="dialog"]',
                      '[class*="overlay"]',
                      '[class*="backdrop"]',
                      '[class*="banner"]',
                      '[class*="notification"]',
                      '[class*="alert"]',
                      '[class*="announcement"]',
                      '[id*="consent"]',
                      '[id*="cookie"]',
                      '[id*="privacy"]',
                      '[id*="modal"]',
                      '[id*="popup"]',
                      '[id*="dialog"]',
                      '[id*="overlay"]',
                      '[id*="backdrop"]',
                      '[id*="banner"]'
                    ];

                    function isProtected(el) {
                      if (!el) return false;
                      if (el.querySelector("[data-hook]") || el.closest("[data-hook]")) return true;
                      
                      let current = el;
                      while (current) {
                        if (current.tagName === 'DIALOG' || 
                            current.getAttribute('role') === 'dialog' || 
                            current.classList.contains('sc-gKXOVf') ||
                            current.classList.contains('dwmyJL')) {
                          
                          if (current.id === 'didomi-host') return false;
                          
                          const text = (current.innerText || current.textContent || "").toLowerCase();
                          const uploadKeywords = [
                            "upload",
                            "wallpaper",
                            "ringtone",
                            "edit meta",
                            "publish",
                            "content policy",
                            "ownership",
                            "title",
                            "tags",
                            "category",
                            "description",
                            "success",
                            "pending",
                            "published"
                          ];
                          if (uploadKeywords.some(kw => text.includes(kw))) {
                            return true;
                          }
                        }
                        current = current.parentElement;
                      }
                      return false;
                    }

                    selectors.forEach(sel => {
                      const els = root.querySelectorAll(sel);
                      els.forEach(el => {
                        if (!isProtected(el)) {
                          el.remove();
                          k++;
                        }
                      });
                    });

                    // Traverse shadow roots recursively
                    const allEls = root.querySelectorAll('*');
                    allEls.forEach(el => {
                      if (el.shadowRoot) {
                        k += nukeElements(el.shadowRoot);
                      }
                    });

                    return k;
                  }

                  killed += nukeElements(document);

                  const iframes = document.querySelectorAll(
                    'iframe[src*="consent"], iframe[src*="cookie"], iframe[src*="privacy"], ' +
                    'iframe[id*="consent"], iframe[id*="cookie"]'
                  );
                  iframes.forEach(iframe => {
                    iframe.remove();
                    killed++;
                  });

                  if (killed > 0 || document.getElementById('didomi-host')) {
                    document.body.style.setProperty("overflow", "auto", "important");
                    document.documentElement.style.setProperty("overflow", "auto", "important");
                    document.body.style.setProperty("pointer-events", "auto", "important");
                    document.documentElement.style.setProperty("pointer-events", "auto", "important");
                  }
                  return killed;
                });
                if (nuked > 0) {
                  console.log(`✅ JS removed ${nuked} blocking elements.`);
                  clickedAny = true;
                }
              } catch (_) {}
            }

            return clickedAny;
          }

          // Keep dismissing Zedge privacy/cookie/data-collection popups whenever they appear
