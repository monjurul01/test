name: Build Meta Monjurul Desktop App

# Builds the Meta Monjurul Compose for Desktop app (Kotlin) for Windows, Linux, and macOS
# on GitHub's own machines - no Gradle / JDK needed on your PC.
#
# How to use:
#   1. Push this repository to GitHub (the folder itself as the repo root).
#   2. GitHub -> Actions -> "Build Meta Monjurul Desktop App" -> Run workflow.
#   3. Select platforms (windows, windows+linux, or all) and click "Run workflow".
#   4. When it finishes, open the run -> Artifacts -> download
#      the installer/package for your platform.
#   5. Push a version tag (`git tag v1.0.0 && git push --tags`) to also get a
#      GitHub Release with every platform attached.
#
# No secrets required. Uses Gradle Wrapper included in the repo.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which desktop builds to make"
        type: choice
        default: windows
        options:
          - windows
          - windows+linux
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release on tag pushes

env:
  # Java version used on the build machines
  JAVA_VERSION: "21"
  # Gradle version (uses wrapper from repo)
  GRADLE_VERSION: "8.7"
  # Application name
  APP_NAME: "Meta Monjurul"
  # Package types per platform
  WINDOWS_PACKAGE: "msi"
  LINUX_PACKAGE: "deb"
  MACOS_PACKAGE: "dmg"

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64 (MSI)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Make gradlew executable
        run: chmod +x gradlew
        shell: bash

      - name: Build Windows Release (MSI)
        run: ./gradlew packageMsi --no-daemon

      - name: Find MSI Installer
        id: msi
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version\s*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          MSI=$(find . -name "*.msi" -path "*/compose/binaries/main/*" | head -n1)
          if [ -z "$MSI" ]; then
            echo "::error::MSI installer not found"
            exit 1
          fi
          OUT_NAME="${APP_NAME// /}-${VERSION}-windows-x64-setup.msi"
          cp "$MSI" "$RUNNER_TEMP/$OUT_NAME"
          echo "path=$RUNNER_TEMP/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.msi.outputs.name }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux x64 (DEB)
    if: ${{ github.event_name == 'push' || inputs.platforms == 'windows+linux' || inputs.platforms == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Linux Release (DEB)
        run: ./gradlew packageDeb --no-daemon

      - name: Find DEB Package
        id: deb
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version\s*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          DEB=$(find . -name "*.deb" -path "*/compose/binaries/main/*" | head -n1)
          if [ -z "$DEB" ]; then
            echo "::error::DEB package not found"
            exit 1
          fi
          OUT_NAME="${APP_NAME// /}-${VERSION}-linux-x64.deb"
          cp "$DEB" "$RUNNER_TEMP/$OUT_NAME"
          echo "path=$RUNNER_TEMP/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.deb.outputs.name }}
          path: ${{ steps.deb.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS (Universal DMG)
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build macOS Release (DMG)
        run: ./gradlew packageDmg --no-daemon

      - name: Find DMG Package
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version\s*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          DMG=$(find . -name "*.dmg" -path "*/compose/binaries/main/*" | head -n1)
          if [ -z "$DMG" ]; then
            echo "::error::DMG package not found"
            exit 1
          fi
          OUT_NAME="${APP_NAME// /}-${VERSION}-macos-universal.dmg"
          cp "$DMG" "$RUNNER_TEMP/$OUT_NAME"
          echo "path=$RUNNER_TEMP/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Release (tags only)
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Meta Monjurul Desktop ${{ github.ref_name }}
          files: dist/**
          generate_release_notes: true
          body: |
            Meta Monjurul desktop app **${{ github.ref_name }}**.

            ## Installation

            ### Windows (Recommended)
            Run `MetaMonjurul-<version>-windows-x64-setup.msi` → Next → Install.
            - Installs to Program Files (per-machine) or user folder (per-user)
            - Adds Start Menu + Desktop shortcuts
            - Uninstall from "Apps & Features"
            - Upgrades in-place when installing newer versions
            - **Note**: Unsigned build. If SmartScreen shows "Windows protected your PC", click *More info → Run anyway*.

            ### Linux
            Install the DEB package:
            ```bash
            sudo apt install ./MetaMonjurul-<version>-linux-x64.deb
            ```
            Or extract and run the binary directly from the tarball if you prefer.

            ### macOS
            Open `MetaMonjurul-<version>-macos-universal.dmg`, drag the app to Applications.
            - **Note**: Unsigned build. Right-click the app → Open (or allow in System Settings → Privacy & Security).

            ## Features
            - **Multi-format import**: SVG, EPS, PNG, JPG, WEBP, TIFF, MP4, MOV, WAV, MP3, FLAC
            - **Glassmorphism previews**: Beautiful dark theme with golden gradients
            - **AI-powered metadata**: Google Gemini API generates titles, descriptions, keywords
            - **Multi-marketplace export**: Adobe Stock, Pond5 (Video/Audio), Shutterstock, Freepik
            - **Pond5 compliant CSV**: Separate formats for video, audio, and images

            ## Requirements
            - Java 21+ (bundled in installers)
            - Gemini API key (configure in Settings ⚙️)
