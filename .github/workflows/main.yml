                  await page.goto(targetContentUrl, { waitUntil: "domcontentloaded" });
                  await page.waitForLoadState("networkidle");
                  await page.waitForTimeout(1000);

                  // Click the Upload (+) button — now already on the right content-type page
                  await safeClick(
                    page.locator("svg.fa-plus").first(),
                    "Upload plus icon"
                  );

                  // Wait for upload dialog to appear
                  await page.waitForTimeout(800);
                  await page.screenshot({ path: `zedge-upload-menu-${uploadNum}.png`, fullPage: false });

                  // Upload the file(s) - 24H sets pass all 4 images at once
                  const filesForUpload = (queueItem.localFiles && queueItem.localFiles.length) ? queueItem.localFiles : queueItem.localFile;
                  await uploadWallpaperInDialog(page, filesForUpload);

                  // Fill in meta (title, tags, category, description)
                  await fillMetaDialog(page, {
                    title:       queueItem.title,
                    tags:        queueItem.tags,
                    category:    queueItem.category,
                    description: queueItem.description,
                    coverImage:  queueItem.localThumb || null
                  });

                  // Check publish status — returns {removed, statusName} instead of throwing
                  const publishResult = await verifyPublishStatus(page);

                  const finalShotPath = `zedge-final-${uploadNum}.png`;
                  await page.screenshot({ path: finalShotPath, fullPage: true });

                  // Always delete from Firebase queue and count the upload on the profile,
                  // regardless of whether it was PUBLISHED or removed (PENDING/IN REVIEW/REJECTED).
                  // Only a true technical error (catch block) skips this.
                  await markWallpaperDoneAndDelete(queueItem.id, queueItem.name, (queueItem.fileUrls && queueItem.fileUrls.length) ? queueItem.fileUrls : queueItem.fileUrl);
                  await updateProfileStateAfterUpload(currentState, currentProfileIndex);

                  // LOCK today's day type after the first rotation (non-pinned) upload,
                  // so the type can never switch mid-day.
                  if (!queueItem.isPinnedPick && currentState.dayTypeLockedDate !== currentState.lastUploadDate) {
                    await firebasePatch("uploadState", { dayTypeLockedDate: currentState.lastUploadDate });
                    currentState = { ...currentState, dayTypeLockedDate: currentState.lastUploadDate };
                    console.log(`🔒 Day type ${dayType} locked for today.`);
                  }

                  // Advance local state for next iteration
                  const profileUploadCounts = { ...(currentState.profileUploadCounts || {}) };
                  profileUploadCounts[currentProfileIndex] = (profileUploadCounts[currentProfileIndex] || 0) + 1;
                  currentState = {
                    ...currentState,
                    totalUploadsToday: currentState.totalUploadsToday + 1,
                    lastUsedProfileIndex: currentProfileIndex,
                    profileUploadCounts
                  };

                  successCount++;

                  const fileTypeLabel = ctypeLabel(queueItem);
                  const greeting = getDhakaGreeting();
                  const statusLine = `<b>${STATUS_UI[publishResult.statusName] || tgEscape(publishResult.statusName)}</b>`;
                  const todayProgress = `${currentState.totalUploadsToday}/${DAILY_LIMIT_UI}`;
                  const itemTitle = tgEscape(queueItem.title || queueItem.name);
                  let notifyMsg = "";
                  if (publishResult.removed) {
                    removedCount++;
                    notifyMsg = tgCard(
                      `⚠️ <b>Zedge কনটেন্ট সরিয়ে দিয়েছে</b>`,
                      [
                        ["👋", `${greeting}।`],
                        ["📁 প্রজেক্ট:", `${tgEscape(runLabel)} · প্রোফাইল #${currentProfileIndex}`],
                        ["🗂 কনটেন্ট:", fileTypeLabel],
                        ["🏷 টাইটেল:", `<b>“${itemTitle}”</b>`],
                        ["📌 Zedge স্ট্যাটাস:", statusLine],
                        ["📅 আজকের ডে:", `${DAY_TYPE_BN[dayType] || dayType} · আপলোড ${todayProgress}`],
                        ["🕒 সময়:", fmtDhakaTime()]
                      ],
                      "💡 ফাইলটি কিউ থেকে সরানো হয়েছে এবং আজকের আপলোড লিমিটে গণনা করা হয়েছে। Zedge এটি রিভিউয়ে রেখেছে/রিজেক্ট করেছে — কনটেন্ট গাইডলাইন চেক করে দেখুন।"
                    );
                    console.log(`⚠️ Upload ${uploadNum} was removed from Zedge (Status: ${publishResult.statusName}). Counted as upload attempt. (${successCount} this run)`);
                  } else {
                    notifyMsg = tgCard(
                      `✅ <b>আপলোড সম্পন্ন</b>`,
                      [
                        ["👋", `${greeting}।`],
                        ["📁 প্রজেক্ট:", `${tgEscape(runLabel)} · প্রোফাইল #${currentProfileIndex}`],
                        ["🗂 কনটেন্ট:", fileTypeLabel],
                        ["🏷 টাইটেল:", `<b>“${itemTitle}”</b>`],
                        ["📌 Zedge স্ট্যাটাস:", statusLine],
                        ["📅 আজকের ডে:", `${DAY_TYPE_BN[dayType] || dayType} · আপলোড ${todayProgress}`],
                        ["🕒 সময়:", fmtDhakaTime()]
                      ],
                      publishResult.statusName === "PUBLISHED"
                        ? "🎉 কনটেন্টটি এখন Zedge-এ লাইভ।"
                        : "⏳ Zedge রিভিউ শেষ হলে লাইভ হবে।"
                    );
                    console.log(`✅ Upload ${uploadNum} complete! Status: ${publishResult.statusName}. (${successCount} this run)`);
                  }
                  
                  if (publishResult.statusName === "PUBLISHED" || publishResult.statusName === "IN REVIEW" || publishResult.statusName === "REJECTED") {
                    await sendTelegramAttachment(finalShotPath, "image", notifyMsg);
                  } else {
                    await sendTelegramNotification(notifyMsg);
                  }

                } catch (uploadErr) {
                  console.error(`❌ Upload ${uploadNum} failed with a technical error: ${uploadErr.message}`);
                  if (queueItem?.id) {
                    await markWallpaperFailed(queueItem.id, uploadErr.message).catch(() => {});
                  }
                  // Take a failure screenshot and continue to next upload
                  const errShotPath = `zedge-error-upload-${uploadNum}.png`;
                  await page.screenshot({ path: errShotPath, fullPage: true }).catch(() => {});
                  console.log("Continuing to next upload despite error...");
                  // Notify user of upload failure
                  failedCount++;
                  try {
                    const errSnippet = tgEscape(String(uploadErr.message || "Unknown error").slice(0, 160));
                    const uploadErrMsg = tgCard(
                      `❌ <b>আপলোড ব্যর্থ</b>`,
                      [
                        ["👋", `${getDhakaGreeting()}।`],
                        ["📁 প্রজেক্ট:", `${tgEscape(runLabel)} · প্রোফাইল #${currentProfileIndex}`],
                        ["🗂 কনটেন্ট:", ctypeLabel(queueItem)],
                        ["🏷 টাইটেল:", `<b>“${tgEscape(queueItem?.title || queueItem?.name || "N/A")}”</b>`],
                        ["🧩 ত্রুটি:", `<code>${errSnippet}</code>`],
                        ["🕒 সময়:", fmtDhakaTime()]
                      ],
                      "🔁 ফাইলটি কিউতে <b>failed</b> মার্ক করা হয়েছে (ড্যাশবোর্ড থেকে requeue করতে পারেন)। পরবর্তী ফাইলে যাচ্ছি…"
                    );
                    if (fs.existsSync(errShotPath)) {
                      await sendTelegramAttachment(errShotPath, "image", uploadErrMsg);
                    } else {
                      await sendTelegramNotification(uploadErrMsg);
                    }
                  } catch (_) {}
                }

                // Advance to the next profile still under its per-profile limit.
                // Successful uploads increment profileUploadCounts and will be skipped once at limit.
                // Failed uploads do NOT increment the count so they may be retried on a future run.
                currentProfileIndex = getNextAvailableProfile(currentProfileIndex, currentState.profileUploadCounts, TOTAL_PROFILES, perProfileLimit);
                if (currentProfileIndex === -1) {
                  console.log("All profiles have uploaded today. No further uploads this run.");
                  break;
                }

                // Small pause between uploads to avoid looking like a bot
                if (i < remainingUploads - 1) {
                  console.log("Waiting 3 seconds before next upload...");
                  await page.waitForTimeout(3000);
                }
              }

              console.log(`\n🏁 Run complete. ${successCount} upload(s) succeeded.`);

              // Save video recording before closing browser
              console.log("\n📹 Saving screen recording...");
              let savedVideoPath = "";
              try {
                const pages = context.pages();
                if (pages.length > 0) {
                  const videoPath = await pages[0].video()?.path();
                  if (videoPath) {
                    console.log(`✅ Video saved to: ${videoPath}`);
                    savedVideoPath = videoPath;
                  }
                }
              } catch (videoErr) {
                console.warn("⚠️ Could not retrieve video path:", videoErr.message);
              }

              await context.close();
              // Wait 2 seconds for video to finish writing to disk
              await new Promise(resolve => setTimeout(resolve, 2000));
              console.log("✅ Video recording finalized.");

              if (savedVideoPath) {
                console.log("Sending video to Telegram...");
                const attempted = successCount + failedCount;
                const published = successCount - removedCount;
                const runHeader = failedCount === 0
                  ? `🏁 <b>রান সম্পন্ন</b>`
                  : `🏁 <b>রান শেষ — আংশিক সফল</b>`;
                const videoCaption = tgCard(
                  runHeader,
                  [
                    ["👋", `${getDhakaGreeting()}।`],
                    ["📁 প্রজেক্ট:", tgEscape(runLabel)],
                    ["📅 আজকের ডে:", DAY_TYPE_BN[dayType] || dayType],
                    ["📊 ফলাফল:", `${published} লাইভ/রিভিউ · ${removedCount} সরানো · ${failedCount} ব্যর্থ (মোট ${attempted})`],
                    ["📈 আজ মোট:", `${currentState.totalUploadsToday}/${DAILY_LIMIT_UI} আপলোড`],
                    ["⏱ সময় লেগেছে:", fmtDuration(Date.now() - runStartedAt)],
                    ["🕒 শেষ:", fmtDhakaTime()]
                  ],
                  "🎬 পুরো রানের স্ক্রিন রেকর্ডিং সংযুক্ত।"
                );
                await sendTelegramAttachment(savedVideoPath, "video", videoCaption, { width: fpVP.width, height: fpVP.height });
              }

              await browser.close();
              
              // Exit cleanly
              process.exit(0);

            } catch (err) {
              console.error("BOT FATAL ERROR:", err);
              // Notify user of fatal crash before exiting
              try {
                const crashFolder = process.env.FOLDER_NAME || "Zedge Bot";
                const crashSnippet = tgEscape(String(err?.message || err || "Unknown fatal error").slice(0, 200));
                const fatalMsg = [
                  `🚨 <b>সিস্টেম ক্র্যাশ রিপোর্ট</b>`,
                  "━━━━━━━━━━━━━━━━",
                  `👋 ${getDhakaGreeting()}।`,
                  `📁 প্রজেক্ট: ${tgEscape(crashFolder)}`,
                  `📝 অবস্থা: রান চলাকালে মারাত্মক ত্রুটি — রান বন্ধ হয়ে গেছে।`,
                  `🧩 ত্রুটি: <code>${crashSnippet}</code>`,
                  `🕒 সময়: ${fmtDhakaTime()}`,
                  "",
                  "🔎 GitHub Actions লগ দেখুন। ক্র্যাশ রেকর্ডিং থাকলে পরের মেসেজে পাবেন।"
                ].join("\n");
                await sendTelegramNotification(fatalMsg);
              } catch (_) {}

              let fatalVideoPath = "";
              try {
                if (context) {
                  const pages = context.pages();
                  if (pages.length > 0) {
                    fatalVideoPath = await pages[0].video()?.path() || "";
                  }
                }
              } catch (_) {}

              if (context) await context.close().catch(() => {});
              if (fatalVideoPath) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                const crashFolder = process.env.FOLDER_NAME || "Zedge Bot";
                const videoCaption = `🎬 <b>ক্র্যাশ রেকর্ডিং</b> · ${tgEscape(crashFolder)} · ${fmtDhakaTime()}`;
                await sendTelegramAttachment(fatalVideoPath, "video", videoCaption).catch(() => {});
              }
              if (browser) await browser.close().catch(() => {});
              process.exit(1);
            }
          })();
          '@ | Set-Content bot.js

      - name: Run bot
        shell: pwsh
        env:
          PROXY_SERVER: ${{ github.event.inputs.proxy_server }}
          PROXY_USER: ${{ github.event.inputs.proxy_user }}
          PROXY_PASS: ${{ github.event.inputs.proxy_pass }}
          ZEDGE_EMAIL: ${{ github.event.inputs.zedge_email }}
          ZEDGE_PASSWORD: ${{ github.event.inputs.zedge_password }}
          HEADLESS: ${{ github.event.inputs.headless }}
          TOTAL_PROFILES: ${{ github.event.inputs.total_profiles }}
          UA_GROUP: ${{ github.event.inputs.ua_group }}
          # Optional - create these two repository secrets to receive Telegram reports
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOLDER_NAME: "Zedge 1"

        run: node bot.js
